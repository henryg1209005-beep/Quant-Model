[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-engine"
version = "0.1.0"
description = "Reference implementation of the AI Trading Engine architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
openai = ["openai>=1.35.0"]
postgres = ["psycopg[binary]>=3.2.0"]

[project.scripts]
ai-trading-engine = "ai_trading_engine.main:main"
ai-trading-api = "ai_trading_engine.server:main"
ai-trading-worker = "ai_trading_engine.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
